version: "3.4"

# restart policy and log limits of the long-running services
x-service-defaults: &service-defaults
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: "20m"
            max-file: "5"

services:
    # flask-api server
    hicognition:
        <<: *service-defaults
        container_name: flask-server
        volumes:
            - ${HICOGNITION_DIR}:/code
            - ${DATA_DIR}:/code/temp/
            - ${LOG_DIR}:/logs/
        environment:
            - FLASK_DEBUG=0
            - FLASK_CONFIG=production
            - FLASK_APP=/code/hicognition_server.py
            - DATABASE_URL=${DATABASE_URL}
            - SECRET_KEY=${SECRET_KEY}
            - REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
            - MAIL_SERVER=${MAIL_SERVER}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
            - SECRET_SALT=${SECRET_SALT}
        ports:
            # only map localhost-port
            - "127.0.0.1:5000:5000"
        build:
            context: "./back_end"
        image: hicognition:latest
        entrypoint: "/bin/bash"
        command: -c "cd /code && ./boot_prod.sh"
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.3

    # nginx server to serve front-end and redirect requests to flask-api
    nginx:
        <<: *service-defaults
        container_name: hicognition-nginx
        build:
            context: "./nginx"
        ports:
            - "80:80"
        # map front-end files
        depends_on:
            - node
            - hicognition
        volumes:
            - ${DIR_FRONT_END}:/front_end
            - ${DIR_STATIC}:/static
            - ${KEY_DIR}:/keys
            - ${DOC_PATH}:/docs
        networks:
            - hicognition-net

    # container to build front-end
    node:
        container_name: node-builder
        image: node:14-buster
        environment:
            - showcase=false
        volumes:
            - ${DIR_FRONT_END}:/front_end
        entrypoint: 
            - "/bin/bash"
        command: -c "cd /front_end && npm install && npm run build"

    # Valkey (redis/Dockerfile); not published on the host, reachable only from containers on
    # hicognition-net;
    # REDIS_URL must contain the password: redis://:<REDIS_PASSWORD>@redis-server:6379/0
    redis-server:
        <<: *service-defaults
        container_name: redis-server
        build:
            context: "./redis"
        command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.5

    redis-worker-long:
        <<: *service-defaults
        volumes: 
            - ${HICOGNITION_DIR}:/code 
            - ${DATA_DIR}:/code/temp/
            - ${LOG_DIR}:/logs/
        environment:
            - LOCAL_INSTALL=1
            - FLASK_DEBUG=0
            - FLASK_APP=/code/hicognition_server.py
            - FLASK_CONFIG=production
            - SECRET_KEY=${SECRET_KEY}
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=${REDIS_URL}
            - RQ_REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
            - MAIL_SERVER=${MAIL_SERVER}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
            - SECRET_SALT=${SECRET_SALT}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
        scale: 5
        image: hicognition:latest
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        # rq takes the Redis URL from RQ_REDIS_URL, which keeps its password out of the process list
        command: -c "sleep 5 && cd /code/ && rq worker hicognition-tasks-long"

    redis-worker-medium:
        <<: *service-defaults
        volumes: 
            - ${HICOGNITION_DIR}:/code 
            - ${DATA_DIR}:/code/temp/
            - ${LOG_DIR}:/logs/
        environment:
            - FLASK_DEBUG=0
            - FLASK_APP=/code/hicognition_server.py
            - FLASK_CONFIG=production
            - SECRET_KEY=${SECRET_KEY}
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=${REDIS_URL}
            - RQ_REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
            - MAIL_SERVER=${MAIL_SERVER}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
            - SECRET_SALT=${SECRET_SALT}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
        scale: 10
        image: hicognition:latest
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        # rq takes the Redis URL from RQ_REDIS_URL, which keeps its password out of the process list
        command: -c "sleep 5 && cd /code/ && rq worker hicognition-tasks-medium"

    redis-worker-short:
        <<: *service-defaults
        volumes:
            - ${HICOGNITION_DIR}:/code 
            - ${DATA_DIR}:/code/temp/
            - ${LOG_DIR}:/logs/
        environment:
            - FLASK_DEBUG=0
            - FLASK_APP=/code/hicognition_server.py
            - FLASK_CONFIG=production
            - SECRET_KEY=${SECRET_KEY}
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=${REDIS_URL}
            - RQ_REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
            - MAIL_SERVER=${MAIL_SERVER}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
            - SECRET_SALT=${SECRET_SALT}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
        scale: 5
        image: hicognition:latest
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        # rq takes the Redis URL from RQ_REDIS_URL, which keeps its password out of the process list
        command: -c "sleep 5 && cd /code/ && rq worker hicognition-tasks-short"

    mysql:
        <<: *service-defaults
        container_name: mysql
        ports:
            # map port out for diagnostics, on localhost only
            - "127.0.0.1:3306:3306"
        environment:
            - MYSQL_RANDOM_ROOT_PASSWORD=yes
            - MYSQL_DATABASE=hicognition
            - MYSQL_USER=hicognition
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        image: mysql/mysql-server:8.0
        volumes:
            - ${MYSQL_DATA_DIR}:/var/lib/mysql
            - ./mysql/mysql.cnf:/etc/my.cnf
            - ${MYSQL_BACKUP_DIR}:/backups
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.9

    hugo-builder:
        container_name: hugo-builder
        image: klakegg/hugo
        volumes:
            - ${DOC_PATH}:/doc
        entrypoint: "/bin/sh"
        command: -c "[ ! -d /doc/public ] || rm -r /doc/public && cd /doc && hugo"

networks:
    hicognition-net:
        ipam:
            driver: default
            config:
                - subnet: 172.18.0.0/16