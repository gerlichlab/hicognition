baseURL = "/docs/"
title = "HiCognition"
theme = "relearn"

canonifyURLs = true

[params]
  # HiCognition's colours, in assets/css/theme-mine.css
  themeVariant = "mine"
  disableLandingPageButton = true
  disableNextPrev = true
  disableInlineCopyToClipBoard = true
  # the dates in the pages' front matter are when they were created, not changed
  hideAuthorDate = true

[[menu.shortcuts]]
name = "<i class='fas fa-tags'></i> Tags"
url = "/tags"
weight = 30

[[menu.shortcuts]] 
name = "<i class='fab fa-github'></i> Github repo"
identifier = "ds"
url = "https://github.com/gerlichlab/HiCognition"
weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true