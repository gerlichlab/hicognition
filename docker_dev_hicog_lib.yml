version: "3.9"
# attention this is the docker-compose version

services:
    node:
        container_name: node
        image: node:24.22.2-trixie-slim
        ports:
            # only map localhost-port
            - "8080:8080"
        volumes:
            - ${DIR_FRONT_END}:/front_end
        environment:
            #TODO: switch back to false
            - showcase=false
        entrypoint: 
            - "/bin/bash"
        command: -c "cd /front_end && npm ci --no-audit --no-fund && npm run dev"

    hicognition:
        container_name: flask-server
        volumes:
            - ${HICOGNITION_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/hicognition
            - ${NGS_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/ngs
            - ${HICOGNITION_DIR}:/code
            - ${SHOWCASE_DIR}:/showcase_data/
        environment:
            - FLASK_DEBUG=1
            - FLASK_APP=/code/hicognition_server.py
            - DATABASE_URL=${DATABASE_URL}
            - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
            - SECRET_SALT=${SECRET_SALT:?set SECRET_SALT in .env}
            - REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
        ports:
            # only map localhost-port
            - "5000:5000"
        build:
            context: "./back_end"
            # with pytest, which the development docs run inside flask-server
            target: test
        image: hicognition:dev
        entrypoint: "/bin/bash"
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.3
        command: -c "cd /code && ./boot_dev.sh"


    redis-server:
        container_name: redis-server
        build:
            context: "./redis"
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.4
        ports:
            - 6379:6379

    redis-worker-long:
        volumes:  
            - ${HICOGNITION_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/hicognition
            - ${NGS_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/ngs
            - ${HICOGNITION_DIR}:/code
        environment:
            - FLASK_DEBUG=1
            - FLASK_APP=/code/hicognition_server.py
            - DATABASE_URL=${DATABASE_URL}
            - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
            - SECRET_SALT=${SECRET_SALT:?set SECRET_SALT in .env}
            - REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
            target: test
        scale: 3
        image: hicognition:dev
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        command: -c "sleep 5 && cd /code/ && rq worker -u ${REDIS_URL} hicognition-tasks-long"

    redis-worker-medium:
        volumes:  
            - ${HICOGNITION_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/hicognition
            - ${NGS_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/ngs
            - ${HICOGNITION_DIR}:/code
        environment:
            - FLASK_DEBUG=1
            - FLASK_APP=/code/hicognition_server.py
            - DATABASE_URL=${DATABASE_URL}
            - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
            - SECRET_SALT=${SECRET_SALT:?set SECRET_SALT in .env}
            - REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
            target: test
        scale: 10
        image: hicognition:dev
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        command: -c "sleep 5 && cd /code/ && rq worker -u ${REDIS_URL} hicognition-tasks-medium"

    redis-worker-short:
        volumes:  
            - ${HICOGNITION_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/hicognition
            - ${NGS_LIB_DIR}:/opt/conda/lib/python3.8/site-packages/ngs
            - ${HICOGNITION_DIR}:/code
        environment:
            - FLASK_DEBUG=1
            - FLASK_APP=/code/hicognition_server.py
            - DATABASE_URL=${DATABASE_URL}
            - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
            - SECRET_SALT=${SECRET_SALT:?set SECRET_SALT in .env}
            - REDIS_URL=${REDIS_URL}
            - UPLOAD_DIR=${UPLOAD_DIR}
            - CHROM_SIZES=${CHROM_SIZES}
            - CHROM_ARMS=${CHROM_ARMS}
        depends_on:
                - redis-server
        build:
            context: "./back_end"
            target: test
        scale: 3
        image: hicognition:dev
        entrypoint: "/bin/bash"
        networks:
            - hicognition-net
        # sleeps to wait for redis-server. TODO: make this check nicer!
        command: -c "sleep 5 && cd /code/ && rq worker -u ${REDIS_URL} hicognition-tasks-short"


    mysql:
        container_name: mysql
        ports:
            # map port out for diagnostics
            - "3306:3306"
        environment:
            - MYSQL_RANDOM_ROOT_PASSWORD=yes
            # root only from inside the container, as mysql/mysql-server set it up
            - MYSQL_ROOT_HOST=localhost
            - MYSQL_DATABASE=hicognition
            - MYSQL_USER=hicognition
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        # the LTS line; an 8.0 data directory is upgraded in place on the first start
        image: mysql:8.4.13
        volumes:
            - ${MYSQL_DATA_DIR}:/var/lib/mysql
            - ./mysql/mysql.cnf:/etc/my.cnf
        networks:
            hicognition-net:
                ipv4_address: 172.18.0.9
    
    hugo-builder:
        container_name: hugo-builder
        # Hugo's official image; it runs as uid 1000 unless told otherwise, and the folder it
        # replaces, public/, was written as root by the image used before
        image: ghcr.io/gohugoio/hugo:v0.169.0
        user: root
        volumes:
            - ${DOC_PATH}:/doc
        entrypoint: "/bin/sh"
        command: -c "[ ! -d /doc/public ] || rm -r /doc/public && cd /doc && hugo"

networks:
    hicognition-net:
        ipam:
            driver: default
            config:
                - subnet: 172.18.0.0/16
